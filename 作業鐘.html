<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: darkgrey;
        }

        #clock1 {
            margin: auto;
            width: 350px;
            height: 350px;
            background: black;
            border-radius: 50%;

            position: absolute;
            /* 這三行是水平垂直居中 */
            top: 50%;
            left: 50%;
            /* 使用 transform 進行微調，往左(150px)、往上(150px) */
            transform: translate(-50%, -50%);
        }

        #clock1::before {
            content: "";
            width: 125px;
            height: 40px;
            border-radius: 25px 25px 0 0;
            background: black;
            position: absolute;
            top: -2%;
            left: 82%;
            transform: translate(-50%, -50%) rotate(30deg);
        }

        #clock1::after {
            content: "";
            width: 125px;
            height: 40px;
            border-radius: 25px 25px 0 0;
            background: black;
            position: absolute;
            top: -2%;
            left: 19%;
            transform: translate(-50%, -50%) rotate(330deg);
        }

        #clock {
            margin: auto;
            width: 300px;
            height: 300px;
            background: white;
            border-radius: 50%;
            box-shadow: inset 0 0 0 10px rgba(0, 0, 0, 0.3);

            position: absolute;
            /* 這三行是水平垂直居中 */
            top: 50%;
            left: 50%;
            /* 使用 transform 進行微調，往左(150px)、往上(150px) */
            transform: translate(-50%, -50%);
        }

        #clock::before {
            content: "";
            position: absolute;
            /* 1. 設定單一顆刻度的形狀與大小（一個 6px 寬的圓點） */
            width: 6px;
            height: 6px;
            border-radius: 50%;
            /* 本體透明，全部用陰影畫出來 */
            /* background: transparent; */

            /* 2. 將基準點精準放在時鐘正中央 (150px - 3px = 147px) */
            top: calc(50% - 3px);
            left: calc(50% - 3px);

            /* 3. 利用 box-shadow 往 12 個方向複製出刻度（半徑距離設為 125px） */
            box-shadow:
                /* 1點 */
                62.5px -108.3px 0 0 #666,
                /* 2點 */
                108.3px -62.5px 0 0 #666,
                /* 3點 */
                125px 0 0 0 #333,
                /* 4點 */
                108.3px 62.5px 0 0 #666,
                /* 5點 */
                62.5px 108.3px 0 0 #666,
                /* 6點 */
                0 125px 0 0 #333,
                /* 7點 */
                -62.5px 108.3px 0 0 #666,
                /* 8點 */
                -108.3px 62.5px 0 0 #666,
                /* 9點 */
                -125px 0 0 0 #333,
                /* 10點 */
                -108.3px -62.5px 0 0 #666,
                /* 11點 */
                -62.5px -108.3px 0 0 #666,
                /* 12點 */
                0 -125px 0 0 #333;
        }

        #clock::after {
            content: "";
            width: 35px;
            height: 45px;
            background: black;
            border-radius: 10px;
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #black {
            margin: auto;
            width: 8%;
            height: 8%;
            background: black;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            /* 使用 transform 進行微調，往左(150px)、往上(150px) */
            transform: translate(-50%, -50%);
        }

        #black::before {
            content: "";
            width: 25px;
            height: 55px;
            background: black;
            border-radius: 5px;
            position: absolute;
            top: 761%;
            left: 451%;
            transform: translate(-50%, -50%) rotate(327deg);
        }

        #black::after {
            content: "";
            width: 25px;
            height: 55px;
            background: black;
            border-radius: 5px;
            position: absolute;
            top: 761%;
            left: -330%;
            transform: translate(-50%, -50%) rotate(33deg);
        }

        #gray {
            margin: auto;
            width: 5%;
            height: 5%;
            background: gray;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            /* 使用 transform 進行微調，往左(150px)、往上(150px) */
            transform: translate(-50%, -50%);
        }

        #gray::before {
            content: "";
            width: 18px;
            height: 44px;
            background: black;
            position: absolute;
            top: -1019%;
            left: 664%;
            transform: translate(-50%, -50%) rotate(32deg);
        }

        #gray::after {
            content: "";
            width: 18px;
            height: 44px;
            background: black;
            position: absolute;
            top: -1019%;
            left: -539%;
            transform: translate(-50%, -50%) rotate(328deg);
        }

        #hour {
            width: 20%;
            height: 8px;
            background-color: black;
            position: absolute;
            left: 30%;
            top: calc(50% - 4px);
            transform-origin: right center;
            border-radius: 4px;
        }

        #minute {
            width: 40%;
            height: 6px;
            background-color: black;
            position: absolute;
            left: 10%;
            top: calc(50% - 3px);
            transform-origin: right center;
            border-radius: 3px;
        }

        #second {
            width: 45%;
            height: 4px;
            background-color: black;
            position: absolute;
            left: 5%;
            top: calc(50% - 2px);
            transform-origin: right center;
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <div id="clock1">
        <div id="clock">
            <div id="hour"></div>
            <div id="minute"></div>
            <div id="second"></div>
            <div id="black"></div>
            <div id="gray"></div>
        </div>
    </div>
    <script>
        const hour = document.getElementById('hour')
        const minute = document.getElementById('minute')
        const second = document.getElementById('second')

        const clock = () => {
            const date = new Date()
            const h = date.getHours()
            const m = date.getMinutes()
            const s = date.getSeconds()

            hour.style.transform = `rotate(${h * 30 + 90}deg)`
            minute.style.transform = `rotate(${m * 6 + 90}deg)`
            second.style.transform = `rotate(${s * 6 + 90}deg)`
        }
        setInterval(clock, 1000)
        clock()
    </script>
</body>

</html>
